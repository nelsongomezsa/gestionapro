spring:
  application:
    name: gestionapro-api
  config:
    import: classpath:itp-rates.yml
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona la app de escritorio + las migraciones de db/migration,
      # que se aplican a mano. La API solo comprueba que sus entidades encajan.
      ddl-auto: validate
      naming:
        # Las tablas y columnas ya existen con nombres propios (Pisos, id_piso...):
        # se usan tal cual vienen en @Table/@Column.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

gestionap:
  jwt:
    expiracion: 8h
  invitaciones:
    validez: 7d
  cobros:
    # Salvo pacto, la renta se paga en los siete primeros días del mes (LAU, art. 17.2).
    dia-limite: 7
    # Recordatorio al inquilino desde estos días antes del límite.
    dias-aviso: 3
  indices:
    # API oficial del INE (Tempus). IRAV: serie IRAV1. IPC general, variación anual:
    # base 2025 desde enero de 2026 (IPC290750) y base 2021 para los meses anteriores (IPC251856).
    url: https://servicios.ine.es/wstempus/js/ES/DATOS_SERIE/
    irav: IRAV1
    ipc: IPC290750,IPC251856
  archivos:
    # Facturas y fotos (fuera de la base y del repositorio).
    dir: ${GESTIONAP_ARCHIVOS_DIR:${user.home}/gestionap-archivos}
  renta:
    # Ninguna actualización supera el IRAV (LAU art. 18.1, redacción del RDL 29/2026).
    tope-irav: true
  ia:
    # Asistente (fase 7). La clave va SOLO en la variable de entorno ANTHROPIC_API_KEY del servidor.
    modelo: claude-opus-5-5
    limite-diario: 40
  push:
    # APNs (notificaciones push). Vacío = desactivado. Necesita una cuenta de pago de Apple Developer.
    clave: ${APNS_KEY_PATH:}
    id-clave: ${APNS_KEY_ID:}
    equipo: ${APNS_TEAM_ID:}
    bundle: com.gestionap.GestionApPro
    produccion: ${APNS_PRODUCCION:false}
  recordatorios:
    # Email de recordatorio a los inquilinos (solo si hay email configurado). "-" lo desactiva.
    cron: "0 0 9 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  error:
    include-stacktrace: never

# Solo la comprobación de salud, sin detalles (la usa la plataforma de despliegue).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
