# Perfil dev: MariaDB local de XAMPP, la misma BD que usa la app de escritorio.
spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gestion_alquileres_pro}
    # Credenciales por variables de entorno (DB_USER y DB_PASS, como en producción); sin ellas, el root de XAMPP sin contraseña.
    # Para usar el usuario de mínimo privilegio: api/sql/crear_usuario_api.sh
    username: ${DB_USER:root}
    password: ${DB_PASS:}
  jpa:
    show-sql: false

gestionap:
  jwt:
    # Se lee de la variable de entorno JWT_SECRET (mínimo 32 caracteres).
    # Genera una en local con: export JWT_SECRET=$(openssl rand -base64 48)
    secret: ${JWT_SECRET}

logging:
  level:
    com.gestionap.api: DEBUG
