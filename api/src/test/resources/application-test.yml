spring:
  datasource:
    url: jdbc:h2:mem:gestionap;MODE=MySQL
    username: sa
    password: ""
  jpa:
    hibernate:
      # El esquema de test (schema.sql) es el de gestion_alquileres_pro tras la
      # migración V1. La validación contra MariaDB real se hace al arrancar en dev.
      ddl-auto: none
  sql:
    init:
      mode: always

gestionap:
  jwt:
    secret: clave-de-tests-no-secreta-solo-para-mvn-test-0000
  recordatorios:
    # En los tests el envío se llama a mano con una fecha fija.
    cron: "-"
  indices:
    # Sin red en los tests: los valores se fijan en cada test.
    url: ""
