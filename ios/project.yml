# Proyecto generado con XcodeGen: el .xcodeproj no se versiona ni se edita a mano.
#   brew install xcodegen && xcodegen generate
name: GestionApPro
options:
  bundleIdPrefix: com.gestionap
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GestionApPro:
    type: application
    platform: iOS
    sources:
      - GestionApPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestionap.GestionApPro
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GestionApPro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # El plist de Debug es el único con excepción ATS (solo red local).
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
  GestionApProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GestionApProTests
    dependencies:
      - target: GestionApPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestionap.GestionApProTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GestionApPro:
    build:
      targets:
        GestionApPro: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GestionApProTests
    archive:
      config: Release
