# Proyecto generado con XcodeGen: el .xcodeproj no se versiona ni se edita a mano.
#   brew install xcodegen && xcodegen generate
name: GestionApPro
options:
  bundleIdPrefix: com.gestionap
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GestionApPro:
    type: application
    platform: iOS
    sources:
      - GestionApPro
      - Compartido
    dependencies:
      - target: GestionApProWidget
    entitlements:
      path: Config/GestionApPro.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gestionap.GestionApPro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestionap.GestionApPro
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GestionApPro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para desbloquear GestionAp con tu cara."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # El plist de Debug es el único con excepción ATS (solo red local).
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
  # Widget de Inicio (cobros del mes). Lee el resumen que guarda la app en el App Group.
  GestionApProWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Compartido
    info:
      path: Config/Info-Widget.plist
      properties:
        CFBundleDisplayName: GestionAp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/GestionApProWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gestionap.GestionApPro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestionap.GestionApPro.Widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  GestionApProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GestionApProTests
    dependencies:
      - target: GestionApPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestionap.GestionApProTests
        GENERATE_INFOPLIST_FILE: YES
  GestionApProUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GestionApProUITests
    dependencies:
      - target: GestionApPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gestionap.GestionApProUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GestionApPro
schemes:
  GestionApPro:
    build:
      targets:
        GestionApPro: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GestionApProTests
    archive:
      config: Release
  # Recorre la app contra una API en marcha y guarda capturas (ver docs/capturas/README.md).
  Capturas:
    build:
      targets:
        GestionApPro: all
        GestionApProUITests: [test]
    test:
      config: Debug
      targets:
        - GestionApProUITests
