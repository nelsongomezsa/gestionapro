name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y pasar los tests
        run: mvn -B -ntp verify
