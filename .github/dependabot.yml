# Avisos y PR automáticos de actualizaciones (dependencias de la API y actions del CI).
version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      parches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
